name: CI

# Triggers are scoped to keep this inside a monthly Actions allowance. An
# unscoped `push:` alongside `pull_request:` runs the whole matrix twice for
# every commit on a branch that has a PR open, and once for every commit on
# every branch that does not — with several agents committing into this
# repository daily, that was the bulk of the spend.
on:
  push:
    branches: [main]
  pull_request:

# Agents land several commits in a row. Without this, each one starts a full
# matrix and the superseded runs keep going to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is deliberately absent, and this is a cost decision with
        # a technical reason behind it. GitHub bills macOS minutes at 10x and
        # Windows at 2x, so a three-OS matrix spends roughly 13 minute-
        # equivalents per wall minute and macOS alone is over three quarters of
        # it. There is no Cocoa backend yet, so a macOS runner executes exactly
        # the platform-independent packages Linux already covers; the one thing
        # it would prove is that darwin compiles, and the Linux leg already
        # cross-compiles GOOS=darwin below at 1x. Add it back in the round that
        # adds the backend, when it starts testing something Linux cannot.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build -o bin/ ./...

      # Cross-compilation is a stated invariant (AGENTS.md), not a convenience: build
      # the other two targets from this host too, with cgo off, so a break shows up on
      # the machine that made it rather than on whoever next checks out on that OS.
      - name: go build (cross-compile other targets)
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          case "${{ matrix.os }}" in
            windows-latest) targets="linux/amd64 darwin/arm64" ;;
            ubuntu-latest)  targets="windows/amd64 darwin/arm64" ;;
          esac
          for t in $targets; do
            echo "::group::GOOS=${t%/*} GOARCH=${t#*/}"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
            echo "::endgroup::"
          done

      - name: go vet
        run: go vet -unsafeptr=false ./...

      # gofmt -l exits 0 whether or not it prints anything, so the check has to fail
      # the job on non-empty output itself. Scoped through `go list` rather than
      # `gofmt -l .`, which would walk into the gitignored _upstream/ checkouts and
      # report every upstream file as unformatted.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test ./...

      # render/d3d11's facet_debug tests, and window's under the same tag, create a
      # real D3D11 device (D3D_DRIVER_TYPE_HARDWARE) and read pixels back from it —
      # they need an actual GPU adapter. A GitHub-hosted runner has none, so these
      # fail rather than skip; that is left visible on purpose instead of building
      # around it, the same way the ui and internal/layering failures are below.
      - name: go test (facet_debug)
        run: go test -tags facet_debug ./...

      # -race needs cgo, and therefore a C compiler, which not every agent's local
      # environment has — this is the one place that verification can happen, so it
      # is not optional. Only the Linux leg has gcc available by default; everything
      # else in this tree builds with cgo off deliberately, so CGO_ENABLED is turned
      # on for this step alone rather than for the job.
      - name: go test (race)
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 1
        run: go test -race ./...
